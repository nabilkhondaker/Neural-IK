robot:
  type: planar_2r
  link_1: 1.0
  link_2: 0.75
  theta1_limits: [-3.14159, 3.14159]
  theta2_limits: [-3.14159, 3.14159]

dataset:
  samples: 100000
  noise_std: 0.0
  train_frac: 0.8
  val_frac: 0.1
  test_frac: 0.1
  branch: elbow_up

model:
  input_dim: 2
  output_dim: 2
  hidden_dims: [128, 128, 64]
  activation: relu
  dropout: 0.0

training:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.00001
  optimizer: adam
  early_stopping_patience: 15

reproducibility:
  seed: 42

evaluation:
  metrics: [mae, rmse, p50, p90, p95, p99]
